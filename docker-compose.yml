# ──────────────────────────────────────────────────────────────
# EduVoice AI — Docker Compose
# ──────────────────────────────────────────────────────────────
version: "3.9"

services:
  eduvoice-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduvoice-ai
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start-period: 10s
      retries: 3
    # Uncomment the following line to add the service to the main backend network
    # networks:
    #   - backend-network

# Uncomment to connect to an existing Docker network (e.g. the main backend)
# networks:
#   backend-network:
#     external: true
#     name: your-main-backend-network-name
